<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบลงชื่อเข้า-ออกงาน</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * { font-family: 'Prompt', sans-serif; box-sizing: border-box; }
        body { background: #0099cc; min-height: 100vh; padding: 20px; }
        .main-header { background: white; border-radius: 20px; padding: 20px 30px; margin-bottom: 20px; text-align: center; }
        .tab-container { background: white; border-radius: 20px; overflow: hidden; }
        .custom-tabs { display: flex; background: #f7fafc; border-bottom: 2px solid #e2e8f0; }
        .custom-tab { flex: 1; padding: 20px; text-align: center; cursor: pointer; border: none; background: transparent; font-weight: 500; color: #718096; }
        .custom-tab.active { color: #0099cc; background: white; border-bottom: 3px solid #0099cc; }
        .tab-content-wrapper { background: white; min-height: 500px; }
        .tab-pane { display: none; padding: 30px; }
        .tab-pane.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .form-label { font-weight: 500; margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
        .form-control, .form-select { border-radius: 12px; padding: 12px 16px; margin-bottom: 20px; }
        .btn-primary { background: #0099cc; border: none; border-radius: 12px; padding: 14px 24px; width: 100%; }
        .camera-container { text-align: center; margin-bottom: 20px; }
        #capturedImage { width: 100%; max-height: 300px; border-radius: 12px; display: none; margin-bottom: 12px; }
        .loading-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; align-items: center; justify-content: center; z-index: 9999; color: white; }
        .password-lock { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 400px; }
        .person-card { border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.08); margin-bottom: 20px; cursor: pointer; }
        .thumbnail-container { height: 200px; background: #eee; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .thumbnail-img { width: 100%; height: 100%; object-fit: cover; }
        .timeline-item { padding: 15px; background: #f7fafc; border-left: 3px solid #0099cc; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="main-header">
        <h2><i class="fas fa-user-clock"></i> ระบบลงเวลาทำงาน</h2>
    </div>

    <div class="tab-container">
        <div class="custom-tabs">
            <button class="custom-tab active" onclick="switchTab('checkin')">ลงชื่อเข้า-ออกงาน</button>
            <button class="custom-tab" onclick="switchTab('report')">รายงานข้อมูล</button>
        </div>

        <div class="tab-content-wrapper">
            <div id="checkin-tab" class="tab-pane active">
                <form id="locationForm">
                    <label class="form-label">ชื่อ-นามสกุล</label>
                    <select class="form-select" id="name" required><option value="">-- กำลังโหลดรายชื่อ --</option></select>

                    <label class="form-label">ประเภท</label>
                    <select class="form-select" id="checkType" required>
                        <option value="">-- เลือกประเภท --</option>
                        <option value="เข้างาน">เข้างาน</option>
                        <option value="ออกงาน">ออกงาน</option>
                    </select>

                    <label class="form-label">พิกัด</label>
                    <input type="text" class="form-control" id="yourLocation" readonly placeholder="กดดึงพิกัด">
                    <input type="hidden" id="latitude"><input type="hidden" id="longitude">
                    <button type="button" class="btn btn-secondary w-100 mb-3" onclick="getLocation()">ดึงพิกัดปัจจุบัน</button>

                    <label class="form-label">รูปถ่าย</label>
                    <div class="camera-container">
                        <img id="capturedImage">
                        <canvas id="canvas" style="display:none;"></canvas>
                        <input type="hidden" id="imageData">
                        <input type="file" id="fileInput" accept="image/*" capture="user" style="display:none;" onchange="handleFileSelect(event)">
                        <button type="button" class="btn btn-secondary w-100" onclick="document.getElementById('fileInput').click()">ถ่ายภาพ</button>
                    </div>

                    <button type="submit" class="btn btn-primary" id="submitBtn">บันทึกข้อมูล</button>
                </form>
            </div>

            <div id="report-tab" class="tab-pane">
                <div id="passwordLockScreen" class="password-lock">
                    <h3>ใส่รหัสผ่าน (2550)</h3>
                    <input type="password" id="passwordInput" class="form-control" style="max-width: 300px;">
                    <button class="btn btn-primary" style="max-width: 300px;" onclick="verifyPassword()">ปลดล็อค</button>
                </div>

                <div id="reportContent" style="display: none;">
                    <button class="btn btn-success mb-3" onclick="refreshData()">รีเฟรชข้อมูล</button>
                    <button class="btn btn-warning mb-3 ms-2" onclick="generatePDF()">สร้าง PDF</button>
                    <div class="row" id="dataContainer"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="detailsModal"><div class="modal-dialog modal-lg"><div class="modal-content">
        <div class="modal-header"><h5 class="modal-title" id="modalPersonName">รายละเอียด</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
        <div class="modal-body"><div id="modalContent"></div></div>
    </div></div></div>

    <div class="loading-overlay" id="loadingOverlay"><div><h4>กำลังประมวลผล...</h4></div></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // ======================================
        // เอา URL จาก Google Apps Script (ตอน Deploy) มาใส่ตรงนี้ครับ 👇
        const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbx9FeaqVWvjpTohUHl6xo1NBTvIkHAchRwAkaUtBXLA7BfGN2gHCO4ze3NlOt8YoT78/exec'; 
        // ======================================

        async function callAPI(action, payload = {}) {
            if (WEB_APP_URL === 'วาง_URL_ตรงนี้') throw new Error("ลืมใส่ URL ครับ");
            const res = await fetch(WEB_APP_URL, { method: 'POST', body: JSON.stringify({ action, ...payload }) });
            const result = await res.json();
            if (!result.success) throw new Error(result.error);
            return result.data;
        }

        // โหลดรายชื่อทันทีที่เปิดเว็บ
        window.onload = async () => {
            try {
                const names = await callAPI('getNames');
                const select = document.getElementById('name');
                select.innerHTML = '<option value="">-- เลือกชื่อของคุณ --</option>';
                names.forEach(n => select.innerHTML += `<option value="${n}">${n}</option>`);
            } catch (e) {
                Swal.fire('Error', 'ดึงรายชื่อไม่สำเร็จ: ' + e.message, 'error');
            }
        };

        function switchTab(tab) {
            document.querySelectorAll('.custom-tab, .tab-pane').forEach(el => el.classList.remove('active'));
            document.querySelectorAll(tab === 'checkin' ? '.custom-tab:nth-child(1), #checkin-tab' : '.custom-tab:nth-child(2), #report-tab')
                .forEach(el => el.classList.add('active'));
        }

        async function verifyPassword() {
            const pwd = document.getElementById('passwordInput').value;
            try {
                const isValid = await callAPI('verifyReportPassword', { password: pwd });
                if (isValid) {
                    document.getElementById('passwordLockScreen').style.display = 'none';
                    document.getElementById('reportContent').style.display = 'block';
                    refreshData();
                } else Swal.fire('ผิดพลาด', 'รหัสผ่านผิด', 'error');
            } catch (e) { Swal.fire('Error', e.message, 'error'); }
        }

        function getLocation() {
            navigator.geolocation.getCurrentPosition(
                pos => {
                    document.getElementById('latitude').value = pos.coords.latitude;
                    document.getElementById('longitude').value = pos.coords.longitude;
                    document.getElementById('yourLocation').value = 'สำเร็จ';
                },
                () => Swal.fire('Error', 'ดึงพิกัดไม่ได้', 'error')
            );
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = e => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.getElementById('canvas');
                    canvas.width = 600; canvas.height = 800; // บีบอัดขนาด
                    canvas.getContext('2d').drawImage(img, 0, 0, 600, 800);
                    const dataUrl = canvas.toDataURL('image/jpeg', 0.6);
                    document.getElementById('imageData').value = dataUrl;
                    document.getElementById('capturedImage').src = dataUrl;
                    document.getElementById('capturedImage').style.display = 'block';
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        document.getElementById('locationForm').onsubmit = async (e) => {
            e.preventDefault();
            const data = {
                name: document.getElementById('name').value,
                checkType: document.getElementById('checkType').value,
                latitude: document.getElementById('latitude').value,
                longitude: document.getElementById('longitude').value,
                imageUrl: document.getElementById('imageData').value
            };
            
            if (!data.latitude) return Swal.fire('Error', 'ดึงพิกัดก่อนครับ', 'warning');
            if (!data.imageUrl) return Swal.fire('Error', 'ถ่ายรูปก่อนครับ', 'warning');

            document.getElementById('loadingOverlay').style.display = 'flex';
            try {
                const imgUrl = await callAPI('uploadImage', { base64Data: data.imageUrl.split(',')[1] });
                data.imageUrl = imgUrl;
                const res = await callAPI('saveData', { data });
                Swal.fire('สำเร็จ', res.message, 'success');
                e.target.reset(); document.getElementById('capturedImage').style.display = 'none';
            } catch (err) {
                Swal.fire('ผิดพลาด', err.message, 'error');
            } finally {
                document.getElementById('loadingOverlay').style.display = 'none';
            }
        };

        let allData = [];
        async function refreshData() {
            document.getElementById('dataContainer').innerHTML = 'กำลังโหลด...';
            try {
                const data = await callAPI('getData');
                allData = data.rows;
                let html = '';
                allData.forEach(row => {
                    html += `<div class="col-md-4"><div class="card person-card" onclick="showModal('${row[1]}')">
                        <div class="thumbnail-container"><img src="${row[5]}" class="thumbnail-img"></div>
                        <div class="card-body"><h5>${row[1]}</h5><p>${row[2]} - ${row[0]}</p></div>
                    </div></div>`;
                });
                document.getElementById('dataContainer').innerHTML = html;
            } catch (e) { Swal.fire('Error', e.message, 'error'); }
        }

        function showModal(name) {
            document.getElementById('modalPersonName').innerText = name;
            let html = '';
            allData.filter(r => r[1] === name).forEach(row => {
                html += `<div class="timeline-item">
                    <b>${row[2]}</b><br>${row[0]}<br>
                    <a href="https://www.google.com/maps/search/?api=1&query=${row[8]},${row[9]}" target="_blank">เปิดแผนที่</a>
                </div>`;
            });
            document.getElementById('modalContent').innerHTML = html;
            new bootstrap.Modal(document.getElementById('detailsModal')).show();
        }

        async function generatePDF() {
            document.getElementById('loadingOverlay').style.display = 'flex';
            try {
                const res = await callAPI('generateReport', { filteredData: allData });
                Swal.fire('สำเร็จ', `<a href="${res.pdfUrl}" target="_blank">ดาวน์โหลด PDF</a>`, 'success');
            } catch (e) { Swal.fire('Error', e.message, 'error'); }
            finally { document.getElementById('loadingOverlay').style.display = 'none'; }
        }
    </script>
</body>
</html>
